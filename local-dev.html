<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>مكنون · معاينة المستقبِل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="monitor.css" />
</head>
<body>
  <div id="bg"></div>
  <main id="root">
    <header id="topbar">
      <div id="brand">
        <span class="logo-dot"></span>
        <span class="brand-text">مكنون · خلية الحروف</span>
      </div>
      <div id="status" class="status">بانتظار…</div>
    </header>

    <section id="scoreboard">
      <div class="player p1" id="player1">
        <div class="name">—</div>
        <div class="score">0</div>
      </div>
      <div class="vs">VS</div>
      <div class="player p2" id="player2">
        <div class="name">—</div>
        <div class="score">0</div>
      </div>
    </section>

    <section id="banner" class="banner hidden">
      <span id="banner-name"></span>
      <span class="muted">يجيب الآن…</span>
    </section>

    <section id="board-wrap">
      <div id="board" class="board"></div>
    </section>
  </main>

  <script src="monitor.js"></script>
  <script>
    // Fake-snapshot generator so we can iterate on visuals without a real
    // Cast device. Buttons in the corner cycle through scenarios.
    const ARABIC = ['أ','ب','ت','ث','ج','ح','خ','د','ذ','ر',
                    'ز','س','ش','ص','ض','ط','ظ','ع','غ','ف',
                    'ق','ك','ل','م','ن','ه','و','ي'];
    function snapshot({ p1Name='أبو فهد', p2Name='أم محمد',
                        p1Score=20, p2Score=30,
                        currentPlayerIndex=0, isQuestionOpen=false,
                        ownedP1=[0, 5, 10], ownedP2=[3, 8, 13],
                        selected=12, win=[] }) {
      const grid = [];
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 5; c++) {
          const idx = r * 5 + c;
          let status = 'available';
          if (ownedP1.includes(idx)) status = 'player1Owned';
          else if (ownedP2.includes(idx)) status = 'player2Owned';
          grid.push({
            index: idx, letter: ARABIC[idx % ARABIC.length],
            status, type: 'letter', row: r, col: c,
          });
        }
      }
      return {
        status: 'playing',
        grid,
        player1: { name: p1Name, score: p1Score },
        player2: { name: p2Name, score: p2Score },
        currentPlayerIndex, completedCells: ownedP1.length + ownedP2.length,
        totalLetterCells: 25,
        selectedCellIndex: selected,
        winnerIndex: null, winningPath: win,
        isQuestionOpen,
      };
    }
    setTimeout(() => window.applyMajlisSnapshot(snapshot({})), 50);

    const btnBar = document.createElement('div');
    btnBar.style.cssText = 'position:fixed;bottom:12px;left:12px;display:flex;gap:8px;z-index:99;';
    function btn(label, mut) {
      const b = document.createElement('button');
      b.textContent = label;
      b.style.cssText = 'padding:8px 14px;border-radius:8px;border:1px solid #444;background:#222;color:#fff;cursor:pointer;font-family:inherit;';
      b.onclick = () => window.applyMajlisSnapshot(snapshot(mut));
      btnBar.appendChild(b);
    }
    btn('Initial', {});
    btn('P1 turn + question', { isQuestionOpen: true });
    btn('P2 turn', { currentPlayerIndex: 1 });
    btn('Late game', {
      p1Score: 80, p2Score: 60,
      ownedP1: [0,1,2,5,10,15,20], ownedP2: [3,4,8,13,18,23],
      selected: null,
    });
    btn('P1 wins', {
      p1Score: 110, p2Score: 80,
      ownedP1: [0,5,10,15,20], ownedP2: [3,8,13],
      win: [0,5,10,15,20], selected: null,
    });
    document.body.appendChild(btnBar);
  </script>
</body>
</html>
