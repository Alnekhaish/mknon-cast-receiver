<head>

  <meta name="description" content="مكنون">

  <meta name="apple-mobile-web-app-title" content="مكنون">

  <title>مكنون</title>

  <link rel="manifest" href="manifest.json">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

       env vars (PROD_API_HOST / USE_HTTPS) so one built image targets any
       backend. Must load before flutter_bootstrap.js. In dev (`flutter run`)

    gtag('config', 'G-LE57HL6MFL');

<!-- CAF receiver boot snippet, injected into the built Flutter web receiver's
     index.html <head> by tool/build_receiver.sh.

     Loads the Cast Application Framework, starts the receiver context, and
     forwards each custom-message snapshot to the Dart side via the global
     window.__mknonOnCastSnapshot (set by cast_receiver_bridge_web.dart).

     Namespace must match the sender (CastBridge.namespace in the app). -->
<script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<script>
  (function () {
    var NAMESPACE = 'urn:x-cast:app.mknon.majlis.letters';
    // Buffer messages that arrive before Dart registers its callback.
    var pending = [];
    window.__mknonOnCastSnapshot = function (json) { pending.push(json); };

    function deliver(json) {
      if (typeof window.__mknonOnCastSnapshot === 'function') {
        window.__mknonOnCastSnapshot(json);
      }
    }
    // When Dart sets the real handler, flush anything buffered.
    var realSetter;
    Object.defineProperty(window, '__mknonOnCastSnapshot', {
      configurable: true,
      get: function () { return realSetter; },
      set: function (fn) {
        realSetter = fn;
        if (pending.length) { pending.forEach(fn); pending = []; }
      },
    });

    if (window.cast && cast.framework && cast.framework.CastReceiverContext) {
      var context = cast.framework.CastReceiverContext.getInstance();
      var options = new cast.framework.CastReceiverOptions();
      options.disableIdleTimeout = true;
      context.addCustomMessageListener(NAMESPACE, function (event) {
        // event.data is the JSON the sender sent (string or object).
        var data = typeof event.data === 'string'
          ? event.data
          : JSON.stringify(event.data);
        deliver(data);
      });
      context.start(options);
    } else {
      console.warn('CAF not present — running as a plain browser receiver.');
    }
  })();
</script>

</head>

<body>
  <!-- Clear old PWA service worker and caches so users get fresh app after redeploy -->
  <script>
    (function(){
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(s){s.unregister();});});
        if ('caches' in window) caches.keys().then(function(k){k.forEach(function(c){caches.delete(c);});});
      }
    })();
  </script>
  <!-- CanvasKit is already the only renderer this app builds for (see the
       flutter build config / Dockerfile), so no renderer override is needed
       here. The previous `window.flutterConfiguration = { renderer: "canvaskit" }`
       override was redundant AND is now forbidden alongside flutter_bootstrap.js
       — it throws the "_usedLegacyConfigStyle" assertion in Flutter 3.32+, which
       crashed the web app on startup. -->
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
